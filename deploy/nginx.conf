# Budget-App – wird von install.sh nach /etc/nginx/sites-available/budget-app kopiert.
# Das Sync-Token liegt in /etc/nginx/conf.d/budget-token.conf (map $http_x_sync_token $budget_sync_ok).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/budget-app/app;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sync-Daten: eine JSON-Datei, lesen per GET, schreiben per PUT
    location = /api/data.json {
        if ($budget_sync_ok = 0) { return 401; }
        root /var/lib/budget-app;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw;
        client_max_body_size 10m;
        add_header Cache-Control "no-store" always;
        limit_except GET PUT { deny all; }
    }
    location /api/ { return 404; }

    # Diese Dateien nie hart cachen, damit Updates sofort ankommen
    location ~ ^/(index\.html|sw\.js|manifest\.json)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
